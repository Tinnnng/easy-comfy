id: flux_schnell_t2i
name: 文生圖（Flux 快速）
description: 用一句話描述畫面，中文英文都可以，約 20 秒產生一張圖。適合第一次嘗試。
order: 1
workflow: workflow_api.json

fields:
  - key: prompt
    label: 畫面描述
    help: 中文或英文都可以，中文會先自動翻成英文。寫出主體、場景、光線和畫風，效果最好。
    type: text
    required: true
    translate: true
    max_length: 2000
    targets: ["4.text"]

  - key: details
    label: 補充細節
    help: 點選想加入的細節，會自動接上英文描述。
    type: tags
    default: []
    max_select: 4
    options:
      - { value: cinematic, label: 電影感光線, append: { "4.text": ", cinematic lighting, dramatic shadows" } }
      - { value: golden, label: 黃金時刻, append: { "4.text": ", golden hour, warm sunlight" } }
      - { value: soft, label: 柔和光線, append: { "4.text": ", soft diffused light" } }
      - { value: neon, label: 霓虹夜色, append: { "4.text": ", neon lights, night scene" } }
      - { value: closeup, label: 特寫, append: { "4.text": ", close-up shot" } }
      - { value: wide, label: 廣角遠景, append: { "4.text": ", wide-angle shot, expansive view" } }
      - { value: bokeh, label: 淺景深, append: { "4.text": ", shallow depth of field, bokeh background" } }
      - { value: aerial, label: 俯瞰視角, append: { "4.text": ", aerial view, from above" } }
      - { value: mist, label: 薄霧, append: { "4.text": ", light mist, atmospheric haze" } }
      - { value: dreamy, label: 夢幻, append: { "4.text": ", dreamy ethereal atmosphere" } }
      - { value: serene, label: 寧靜, append: { "4.text": ", calm serene mood" } }
      - { value: detailed, label: 高細節, append: { "4.text": ", highly detailed, intricate details, sharp focus" } }

  - key: style
    label: 畫風
    help: 會在描述後面自動加上對應的英文風格詞。
    type: choice
    default: none
    options:
      - value: none
        label: 不指定
      - value: photo
        label: 寫實攝影
        append: { "4.text": ", photorealistic, 35mm photograph, natural lighting, sharp focus, high detail" }
      - value: anime
        label: 動漫
        append: { "4.text": ", anime style illustration, cel shading, vibrant colors, clean line art" }
      - value: watercolor
        label: 水彩
        append: { "4.text": ", watercolor painting, soft washes of color, visible paper texture" }
      - value: oil
        label: 油畫
        append: { "4.text": ", oil painting, thick impasto brush strokes, rich canvas texture" }
      - value: render
        label: 3D 渲染
        append: { "4.text": ", 3D render, octane render, studio lighting, subsurface scattering" }
      - value: pixel
        label: 像素藝術
        append: { "4.text": ", pixel art, 16-bit retro game style, limited color palette" }

  - key: size
    label: 尺寸
    type: choice
    default: square
    options:
      - value: square
        label: 方形 1024×1024
        set: { "6.width": 1024, "6.height": 1024 }
      - value: portrait
        label: 直式 832×1216
        set: { "6.width": 832, "6.height": 1216 }
      - value: landscape
        label: 橫式 1216×832
        set: { "6.width": 1216, "6.height": 832 }

  - key: quality
    label: 細節程度
    help: 步數越多細節越多，但越慢。Flux schnell 4 步通常就夠了。
    type: choice
    default: normal
    advanced: true
    options:
      - value: fast
        label: 快速（2 步）
        set: { "7.steps": 2 }
      - value: normal
        label: 標準（4 步）
        set: { "7.steps": 4 }
      - value: fine
        label: 精細（8 步）
        set: { "7.steps": 8 }

  - key: seed
    label: 隨機種子
    help: -1 代表每次隨機。想重現同一張圖時，填入歷史紀錄裡的種子。
    type: seed
    default: -1
    advanced: true
    targets: ["7.seed"]
